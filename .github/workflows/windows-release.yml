name: Windows desktop release

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a downloadable GitHub Release
        type: boolean
        default: false
      tag:
        description: Release tag (must match package.json, for example v1.1.0)
        type: string
        default: v1.1.0

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$version") {
            throw 'The release tag must match package.json (for example v1.1.0).'
          }
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:unit
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist:win
      - name: Create checksum
        shell: pwsh
        run: |
          $artifact = Get-Item "release/Prism-Studio-*-Portable-x64.exe"
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($artifact.Name)" | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Studio-Windows-x64
          path: |
            release/Prism-Studio-*-Portable-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $artifact = Get-Item "release/Prism-Studio-*-Portable-x64.exe"
          gh release create $env:RELEASE_TAG $artifact.FullName release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Prism Studio $env:RELEASE_TAG" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
